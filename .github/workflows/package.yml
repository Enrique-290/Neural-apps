name: Package NoteHub v0.2.3

on:
  push:
    branches:
      - notehub-v0.2.3-package
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check assets/js/app.js
      - name: Create ZIP
        run: zip -r NoteHub_v0.2.3.zip index.html assets manifest.json service-worker.js README.md iniciar-servidor.bat iniciar-servidor.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NoteHub_v0.2.3
          path: NoteHub_v0.2.3.zip
          if-no-files-found: error
